[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agent"
version = "0.1.0"
description = "A small terminal coding agent for local Ollama models. No API keys, no cloud."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ollama-agent contributors" }]
keywords = ["ollama", "agent", "llm", "cli", "local", "coding-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.scripts]
agent = "ollama_agent.cli:main"

[project.urls]
Homepage = "https://github.com/OWNER/ollama-agent"
Issues = "https://github.com/OWNER/ollama-agent/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ollama_agent = ["py.typed"]
